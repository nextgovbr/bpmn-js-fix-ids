# Stub do code review. Este arquivo nao deve precisar de manutencao —
# modelo, teto de turns, escopo e filtros vivem em nextgovbr/workflows.
#
# Para customizar este repo, passe inputs:
#
#   with:
#     max_turns: 30
#     extra_instructions: "Preste atencao especial a migrations."
#
name: Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
jobs:
  review:
    uses: nextgovbr/workflows/.github/workflows/code-review.yml@v1
    secrets: inherit
